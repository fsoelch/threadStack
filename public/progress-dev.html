<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreadStack — Fortschritt Dev Harness</title>
<style>
  html, body { margin:0; padding:0; font-family: 'DM Sans', -apple-system, system-ui, sans-serif; background:#F5F5F2; color:#111210; }
  #dev-toolbar {
    display:flex; gap:8px; align-items:center; padding:8px 12px; background:#0D0F11; color:#fff; font-size:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:50;
  }
  #dev-toolbar button {
    background:#1e293b; color:#fff; border:1px solid #334155; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px;
    font-family:inherit;
  }
  #dev-toolbar button:hover { background:#334155; }
  #dev-toolbar .sep { width:1px; height:18px; background:#334155; margin:0 2px; }
  #dev-status { margin-left:auto; opacity:.8; }
  #dev-layout { display:flex; gap:24px; padding:24px; max-width:1100px; margin:0 auto; align-items:flex-start; flex-wrap:wrap; }
  .dev-col { flex:1 1 420px; min-width:340px; }
  .dev-col h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:#5A5850; margin:0 0 10px; }
  #reentry-root, #reentry-root-2, #reentry-root-3 { margin-bottom:18px; }
  #timeline-panel {
    background:#fff; border:1px solid #E8E7E2; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(16,22,30,.05);
  }
  #dev-log {
    position:fixed; bottom:0; left:0; right:0; max-height:140px; overflow-y:auto;
    background:#0f172a; color:#a7f3d0; font-family:monospace; font-size:11px; padding:6px 10px; display:none; z-index:100;
  }
  #dev-log.open { display:block; }
</style>
<link rel="stylesheet" href="progress.css">
</head>
<body>

<div id="dev-toolbar">
  <strong>Fortschritt Dev Harness</strong>
  <button id="btn-mount">Mount (alle)</button>
  <button id="btn-unmount">Unmount (alle)</button>
  <button id="btn-invalidate">Invalidate Cache</button>
  <span class="sep"></span>
  <button id="btn-scenario-normal">Szenario: Normal (dormant + KI)</button>
  <button id="btn-scenario-empty">Szenario: Leer (kein Zwischenstand)</button>
  <button id="btn-scenario-result">Szenario: mit Stack-Abschluss</button>
  <button id="btn-scenario-manypages">Szenario: Pagination (2 Seiten)</button>
  <span class="sep"></span>
  <button id="btn-error-initial">Initial-Fehler simulieren</button>
  <button id="btn-error-loadmore">Nachlade-Fehler simulieren</button>
  <button id="btn-toggle-ai">KI an/aus (aktuell: <span id="ai-state">an</span>)</button>
  <button id="btn-clear-dismiss">Dismiss-Storage löschen</button>
  <button id="btn-toggle-log">Log ein/aus</button>
  <span id="dev-status">bereit</span>
</div>

<div id="dev-layout">
  <div class="dev-col">
    <h2>Wiedereinstiegskarte — Szenario A (mit KI)</h2>
    <div id="reentry-root"></div>
    <h2>Wiedereinstiegskarte — Szenario B (leer / reduziert)</h2>
    <div id="reentry-root-2"></div>
  </div>
  <div class="dev-col">
    <h2>Zeitstrahl</h2>
    <div id="timeline-panel">
      <div id="timeline-root"></div>
    </div>
  </div>
</div>

<div id="dev-log"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('dev-log');
  function log(msg) {
    var line = document.createElement('div');
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.__devLog = log; // im zweiten (nach progress.js geladenen) Script wiederverwendet
  document.getElementById('btn-toggle-log').addEventListener('click', function () {
    logEl.classList.toggle('open');
  });

  // =========================================================================
  // Mock-Datenmodell (In-Memory) — simuliert das Backend aus dem
  // ProgressDetail-Vertrag (Paket S1, parallel entstehend).
  // =========================================================================

  function iso(daysAgo, hour) {
    var d = new Date();
    d.setUTCHours(hour == null ? 10 : hour, 0, 0, 0);
    d.setUTCDate(d.getUTCDate() - daysAgo);
    return d.toISOString();
  }

  function makeEntry(id, daysAgo, bodyHtml, opts) {
    opts = opts || {};
    return {
      id: id, refType: 'todo', refId: 'a1', kind: opts.kind || 'note',
      source: opts.source || 'manual', bodyHtml: bodyHtml,
      excerpt: bodyHtml.replace(/<[^>]+>/g, '').slice(0, 280),
      createdAt: iso(daysAgo), editedAt: opts.editedAt || null,
      gapDaysBefore: opts.gapDaysBefore != null ? opts.gapDaysBefore : null,
      showDormancyMarker: !!opts.showDormancyMarker,
      editable: opts.kind === 'result' ? false : (opts.editable !== false)
    };
  }

  var scenarios = {
    normal: function () {
      return {
        ref: { type: 'todo', id: 'a1', title: 'Angebot für Kunde X finalisieren', done: false, exists: true },
        goal: 'Verbindliches Angebot inkl. Rabattstaffel bis Monatsende beim Kunden platzieren.',
        goalUpdatedAt: iso(40),
        nextStep: 'Rückmeldung von Einkauf zur Rabattstaffel einholen',
        nextStepUpdatedAt: iso(24),
        stats: { entryCount: 4, firstEntryAt: iso(40), lastEntryAt: iso(24), lastActivityAt: iso(24), dormant: true, dormantDays: 24, stale: true, staleDays: 24 },
        reentry: {
          show: true, dormantSince: iso(24), dormantLabel: '3 Wochen', empty: false,
          ai: { available: true, frameId: 'frame-a1' }
        },
        entries: [
          makeEntry('e4', 24, '<p>Rabattstaffel-Vorschlag an Einkauf verschickt, Rückmeldung ausstehend.</p>', { gapDaysBefore: 12, showDormancyMarker: true }),
          makeEntry('e3', 36, '<p>Erste Preiskalkulation mit Vertrieb abgestimmt. Noch offen: Sonderkonditionen für Bestandskunden. ' +
            'Zusätzlich wurde diskutiert, ob eine gestaffelte Rabattstruktur ab 3 Einheiten sinnvoll ist, und welche ' +
            'Auswirkungen das auf die Marge im ungünstigsten Fall hätte — das wird noch mit der Geschäftsführung geklärt.</p>'),
          makeEntry('e2', 38, '<p>Kickoff mit Kunde X: Anforderungen aufgenommen.</p>'),
          makeEntry('e1', 40, '<p>Anfrage von Kunde X eingegangen, erste Sichtung.</p>', { kind: 'result' })
        ],
        page: { limit: 20, hasMore: false, nextCursor: null }
      };
    },
    empty: function () {
      return {
        ref: { type: 'todo', id: 'a2', title: 'Interne Doku aufräumen', done: false, exists: true },
        goal: '', goalUpdatedAt: null, nextStep: '', nextStepUpdatedAt: null,
        stats: { entryCount: 0, firstEntryAt: null, lastEntryAt: null, lastActivityAt: null, dormant: false, dormantDays: 0, stale: false, staleDays: 0 },
        reentry: { show: true, dormantSince: iso(9), dormantLabel: '9 Tage', empty: true, ai: { available: false } },
        entries: [],
        page: { limit: 20, hasMore: false, nextCursor: null }
      };
    },
    manypages: function () {
      var entries = [];
      for (var i = 0; i < 5; i++) {
        entries.push(makeEntry('p' + i, i * 2, '<p>Zwischenstand Nr. ' + (5 - i) + ' — laufende Abstimmung.</p>', i === 4 ? { gapDaysBefore: 16, showDormancyMarker: true } : {}));
      }
      return {
        ref: { type: 'todo', id: 'a3', title: 'Migration Datenbank vorbereiten', done: false, exists: true },
        goal: 'Zero-Downtime-Migration auf neue DB-Version bis Q4.',
        goalUpdatedAt: iso(10), nextStep: 'Testlauf auf Staging wiederholen', nextStepUpdatedAt: iso(0),
        stats: { entryCount: 9, firstEntryAt: iso(16), lastEntryAt: iso(0), lastActivityAt: iso(0), dormant: false, dormantDays: 0, stale: false, staleDays: 0 },
        reentry: { show: false, dormantSince: null, dormantLabel: null, empty: false, ai: { available: false } },
        entries: entries,
        page: { limit: 5, hasMore: true, nextCursor: 'page2' }
      };
    }
  };

  var store = { a1: scenarios.normal(), a2: scenarios.empty(), a3: scenarios.manypages() };
  var mock = { simulateInitialError: false, simulateLoadMoreError: false, aiEnabled: true };
  window.__devMock = mock; // im zweiten Script (Toolbar-Wiring) wiederverwendet
  window.__devStore = store;
  window.__devScenarios = scenarios;

  function cloneDetail(refId) {
    return JSON.parse(JSON.stringify(store[refId]));
  }

  // ---- window.TSHost Mock ---------------------------------------------------
  window.TSHost = {
    api: function (method, path) {
      log(method + ' ' + path);
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (method === 'GET' && /^\/api\/progress\/todo\/a3\?cursor=page2$/.test(path)) {
            resolve({
              entries: [makeEntry('p5', 20, '<p>Ältester Zwischenstand (Seite 2).</p>')],
              page: { limit: 5, hasMore: false, nextCursor: null }
            });
            return;
          }
          var m = path.match(/^\/api\/progress\/(todo|topic)\/([^/?]+)/);
          if (!m) { reject(new Error('unbekannter Pfad')); return; }
          var refId = m[2];
          if (mock.simulateInitialError && !path.includes('cursor=')) {
            reject(Object.assign(new Error('Simulierter Serverfehler'), { status: 500 }));
            return;
          }
          if (mock.simulateLoadMoreError && path.includes('cursor=')) {
            reject(Object.assign(new Error('Simulierter Nachlade-Fehler'), { status: 500 }));
            return;
          }
          if (!store[refId]) { reject(Object.assign(new Error('nicht gefunden'), { status: 404 })); return; }
          resolve(cloneDetail(refId));
        }, 150 + Math.random() * 150);
      });
    },
    toast: function (msg, type) { log('TOAST[' + type + ']: ' + msg); },
    escHtml: function (s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },
    confirm: function (opts) {
      return Promise.resolve(window.confirm((opts.title || '') + '\n\n' + (opts.message || '')));
    },
    reducedMotion: function () { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; },
    progress: {
      openEntryDialog: function (ctx) {
        log('openEntryDialog(' + JSON.stringify({ refType: ctx.refType, refId: ctx.refId, entryId: ctx.entryId }) + ')');
        var text = window.prompt('Mock-Dialog: Zwischenstand-Text (Klartext, wird als <p> gespeichert). Leer = Abbrechen.', ctx.entryId ? 'Bearbeiteter Text …' : '');
        if (text == null || text.trim() === '') return Promise.resolve('cancelled');
        var detail = store[ctx.refId];
        if (ctx.entryId) {
          var e = detail.entries.filter(function (x) { return x.id === ctx.entryId; })[0];
          if (e) { e.bodyHtml = '<p>' + text.replace(/</g, '&lt;') + '</p>'; e.editedAt = new Date().toISOString(); }
        } else {
          detail.entries.unshift(makeEntry('new' + Date.now(), 0, '<p>' + text.replace(/</g, '&lt;') + '</p>'));
          detail.stats.entryCount++;
          detail.reentry.show = false;
        }
        return Promise.resolve('saved');
      },
      openGoalDialog: function (ctx) {
        log('openGoalDialog(' + JSON.stringify({ refType: ctx.refType, refId: ctx.refId }) + ')');
        var text = window.prompt('Mock-Dialog: neues Zielbild', ctx.goal || '');
        if (text == null) return Promise.resolve('cancelled');
        store[ctx.refId].goal = text;
        return Promise.resolve('saved');
      },
      confirmDelete: function (opts) {
        return Promise.resolve(window.confirm((opts.title || 'Löschen?') + '\n\n' + (opts.message || '')));
      },
      aiReentry: function (frameId) {
        log('aiReentry(' + frameId + ')');
        return new Promise(function (resolve) {
          setTimeout(function () {
            resolve('KI-Zusammenfassung (Mock): Das Vorhaben ruht seit 3 Wochen. Letzter Stand: Rabattstaffel wurde an den Einkauf ' +
              'geschickt, Antwort steht noch aus. Vorschlag für den Wiedereinstieg: kurze Erinnerung an den Einkauf senden.');
          }, 700);
        });
      },
      aiEnabled: function () { return mock.aiEnabled; },
      onProgressChanged: function (refType, refId) { log('onProgressChanged(' + refType + ', ' + refId + ')'); }
    }
  };

  // Mock-DELETE für Zwischenstände (siehe Abweichungsdokumentation im
  // Abschlussbericht: Endpunkt ist eine Annahme, kein bestätigter Vertrag).
  var origApi = window.TSHost.api;
  window.TSHost.api = function (method, path, body) {
    if (method === 'DELETE' && /^\/api\/progress\/entries\//.test(path)) {
      log('DELETE ' + path);
      var id = decodeURIComponent(path.split('/').pop());
      Object.keys(store).forEach(function (refId) {
        store[refId].entries = store[refId].entries.filter(function (e) { return e.id !== id; });
        store[refId].stats.entryCount = store[refId].entries.length;
      });
      return new Promise(function (resolve) { setTimeout(function () { resolve({ ok: true }); }, 150); });
    }
    return origApi.apply(this, arguments);
  };

  log('Dev-Harness bereit. TSHost gemockt, In-Memory-Store aktiv.');
})();
</script>
<script src="progress.js"></script>
<script>
// Toolbar-Wiring: läuft NACH progress.js, damit window.TSProgress bereits
// definiert ist (Skriptreihenfolge ohne defer, siehe graph-dev.html-Vorbild).
(function () {
  'use strict';
  var log = window.__devLog;
  var mock = window.__devMock;
  var store = window.__devStore;
  var scenarios = window.__devScenarios;

  var status = document.getElementById('dev-status');
  var timelineHandle = null, reentryHandle = null, reentryHandle2 = null;

  function mountAll() {
    timelineHandle = window.TSProgress.mountTimeline(document.getElementById('timeline-root'), { refType: 'todo', refId: 'a1' });
    reentryHandle = window.TSProgress.mountReentryCard(document.getElementById('reentry-root'), { refType: 'todo', refId: 'a1' });
    reentryHandle2 = window.TSProgress.mountReentryCard(document.getElementById('reentry-root-2'), { refType: 'todo', refId: 'a2' });
    status.textContent = 'gemountet';
  }
  function unmountAll() {
    if (timelineHandle) timelineHandle.destroy();
    if (reentryHandle) reentryHandle.destroy();
    if (reentryHandle2) reentryHandle2.destroy();
    timelineHandle = reentryHandle = reentryHandle2 = null;
    status.textContent = 'unmounted';
  }

  document.getElementById('btn-mount').addEventListener('click', mountAll);
  document.getElementById('btn-unmount').addEventListener('click', unmountAll);
  document.getElementById('btn-invalidate').addEventListener('click', function () {
    window.TSProgress.invalidate('todo', 'a1');
    window.TSProgress.invalidate('todo', 'a2');
    window.TSProgress.invalidate('todo', 'a3');
    log('Cache invalidiert für a1/a2/a3');
  });

  function switchTimelineTo(refId, scenarioFactory) {
    store[refId] = scenarioFactory();
    window.TSProgress.invalidate('todo', refId);
    if (timelineHandle) timelineHandle.destroy();
    timelineHandle = window.TSProgress.mountTimeline(document.getElementById('timeline-root'), { refType: 'todo', refId: refId });
  }

  document.getElementById('btn-scenario-normal').addEventListener('click', function () {
    mock.simulateInitialError = false; mock.simulateLoadMoreError = false;
    switchTimelineTo('a1', scenarios.normal);
  });
  document.getElementById('btn-scenario-empty').addEventListener('click', function () {
    mock.simulateInitialError = false; mock.simulateLoadMoreError = false;
    switchTimelineTo('a2', scenarios.empty);
  });
  document.getElementById('btn-scenario-result').addEventListener('click', function () {
    mock.simulateInitialError = false; mock.simulateLoadMoreError = false;
    switchTimelineTo('a1', scenarios.normal);
  });
  document.getElementById('btn-scenario-manypages').addEventListener('click', function () {
    mock.simulateInitialError = false; mock.simulateLoadMoreError = false;
    switchTimelineTo('a3', scenarios.manypages);
  });
  document.getElementById('btn-error-initial').addEventListener('click', function () {
    mock.simulateInitialError = true;
    window.TSProgress.invalidate('todo', 'a1');
    if (timelineHandle) timelineHandle.reload();
    setTimeout(function () { mock.simulateInitialError = false; }, 5000);
  });
  document.getElementById('btn-error-loadmore').addEventListener('click', function () {
    mock.simulateLoadMoreError = true;
    log('Nachlade-Fehler aktiv — bitte "Weitere laden" im Pagination-Szenario klicken.');
    setTimeout(function () { mock.simulateLoadMoreError = false; }, 8000);
  });
  document.getElementById('btn-toggle-ai').addEventListener('click', function () {
    mock.aiEnabled = !mock.aiEnabled;
    document.getElementById('ai-state').textContent = mock.aiEnabled ? 'an' : 'aus';
    if (reentryHandle) reentryHandle.reload();
  });
  document.getElementById('btn-clear-dismiss').addEventListener('click', function () {
    Object.keys(window.localStorage).filter(function (k) { return k.indexOf('ts.progress.dismiss.') === 0; })
      .forEach(function (k) { window.localStorage.removeItem(k); });
    log('Dismiss-Storage gelöscht');
    if (reentryHandle) reentryHandle.reload();
    if (reentryHandle2) reentryHandle2.reload();
  });

  window.addEventListener('DOMContentLoaded', mountAll);
  if (document.readyState !== 'loading') mountAll();
})();
</script>
</body>
</html>
